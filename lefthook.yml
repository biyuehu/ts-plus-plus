pre-commit:
  parallel: false
  commands:
    dprint:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs,json,jsonc,yml,yaml}'
      run: npm run format
      stage_fixed: true
    lint:
      glob: '*.{ts,tsx,js,jsx,mjs,cjs}'
      run: npm run lint --workspace=ts-plus-plus
    knip:
      run: npm run knip
