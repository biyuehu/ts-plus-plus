name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint

  knip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Unused exports
        run: npm run knip

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build src
        run: npm run build:src --workspace=ts-plus-plus

  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build tsc
        run: npm run build:tsc --workspace=ts-plus-plus
      - name: Clean
        run: npm run clean:src --workspace=ts-plus-plus
      - name: Self build
        run: npm run build:src:built --workspace=ts-plus-plus

  tspp-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build compiler for macro workers
        run: npm run build:compiler
      - name: TS++ unit tests
        run: npm run test:tspp --workspace=ts-plus-plus

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build compiler
        run: npm run build:compiler
      - name: Check examples
        run: |
          status=0
          for config in packages/examples/*/tsppconfig.json; do
            dir=$(dirname "$config")
            echo "Checking $dir"
            (cd "$dir" && node ../../compiler/built/local/tsc.js --project tsppconfig.json) || status=1
          done
          exit $status

  language-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/language-server/pnpm-lock.yaml
      - run: pnpm --dir packages/language-server install --frozen-lockfile
      - name: Typecheck
        run: pnpm --dir packages/language-server typecheck
      - name: Lint
        run: pnpm --dir packages/language-server lint
      - name: Tests
        run: pnpm --dir packages/language-server test:commit
      - name: Build
        run: pnpm --dir packages/language-server build

  playground:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/playground/package-lock.json
      - run: npm ci
      - run: npm --prefix packages/playground ci
      - name: Build compiler
        run: npm run build:compiler
      - name: Generate compiler bundle and examples
        run: |
          npm run playground:bundle
          npm run playground:examples
      - name: Build playground
        run: npm run build:playground

  # baselines:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: npm
  #     - run: npm ci
  #     - name: Remove all baselines
  #       run: rm -rf tests/baselines/reference
  #     - name: Run tests
  #       run: npm test &> /dev/null || exit 0
  #     - name: Accept baselines
  #       run: |
  #         npx hereby baseline-accept
  #         git add tests/baselines/reference
  #     - name: Check baselines
  #       run: git diff --staged --exit-code

  # test:
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       config:
  #         - os: ubuntu-latest
  #           node-version: '22'
  #           bundle: true
  #         - os: ubuntu-latest
  #           node-version: '22'
  #           bundle: false
  #   runs-on: ${{ matrix.config.os }}
  #   name: Test Node ${{ matrix.config.node-version }} on ${{ matrix.config.os }}${{ (!matrix.config.bundle && ' with --no-bundle') || '' }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ matrix.config.node-version }}
  #         cache: npm
  #     - run: npm ci
  #     - name: Tests
  #       env:
  #         BUNDLE: ${{ matrix.config.bundle }}
  #       run: npm run test -- --no-lint --bundle="$BUNDLE"

  required:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - check
      - knip
      - typecheck
      - self-check
      - tspp-tests
      - examples
      - language-server
      - playground
      # - baselines
      # - test
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          ! echo $NEEDS | jq -e 'to_entries[] | { job: .key, result: .value.result } | select((.result == "success" or .result == "skipped") | not)'
