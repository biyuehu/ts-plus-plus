  #       run: git diff --staged --exit-code

  # test:
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       config:
  #         - os: ubuntu-latest
  #           node-version: '22'
  #           bundle: true
  #         - os: ubuntu-latest
  #           node-version: '22'
  #           bundle: false
  #   runs-on: ${{ matrix.config.os }}
  #   name: Test Node ${{ matrix.config.node-version }} on ${{ matrix.config.os }}${{ (!matrix.config.bundle && ' with --no-bundle') || '' }}
  #   steps:
