  #     matrix:
  #       config:
  #         - os: ubuntu-latest
  #           node-version: '22'
  #           bundle: true
  #         - os: ubuntu-latest
  #           node-version: '22'
  #           bundle: false
  #   runs-on: ${{ matrix.config.os }}
  #   name: Test Node ${{ matrix.config.node-version }} on ${{ matrix.config.os }}${{ (!matrix.config.bundle && ' with --no-bundle') || '' }}
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: ${{ matrix.config.node-version }}
  #         cache: pnpm
  #     - run: pnpm install --frozen-lockfile
  #     - name: Tests
  #       env:
  #         BUNDLE: ${{ matrix.config.bundle }}
  #       run: pnpm test -- --no-lint --bundle="$BUNDLE"

  required:
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - check
      - knip
      - typecheck
      - self-check
      - tspp-tests
      - examples
      - language-server
      - playground
      # - baselines
      # - test
    steps:
      - name: Check required jobs
        env:
          NEEDS: ${{ toJson(needs) }}
        run: |
          ! echo $NEEDS | jq -e 'to_entries[] | { job: .key, result: .value.result } | select((.result == "success" or .result == "skipped") | not)'
