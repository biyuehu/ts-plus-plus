<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="228" height="140" viewBox="0 0 228 140" fill="none">

  <defs>
    <style>
      .avatar-card {
        transition: transform 0.2s ease-in-out;
      }
      .avatar-card:hover {
        transform: translateY(-3px);
      }
      .avatar-img {
        border-radius: 50%;
      }
      .username {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 12px;
        font-weight: 500;
        fill: #57606a;
        text-anchor: middle;
      }
      @media (prefers-color-scheme: dark) {
        .username {
          fill: #8b949e;
        }
      }
    </style>
  
    <clipPath id="clip-0">
      <circle cx="32" cy="32" r="32" />
    </clipPath>
    <clipPath id="clip-1">
      <circle cx="32" cy="32" r="32" />
    </clipPath>
  </defs>

  <g class="avatar-card" transform="translate(24, 24)">
    <a href="https://github.com/biyuehu" target="_blank" rel="noopener noreferrer">
      <title>有村ロミ</title>
      <circle cx="40" cy="32" r="33.5" fill="none" stroke="#d0d7de" stroke-width="1.5" />
      <g transform="translate(8, 0)" clip-path="url(#clip-0)">
        <image href="data:image/jpeg;base64," width="64" height="64" />
      </g>
      <text class="username" x="40" y="82">biyuehu</text>
    </a>
  </g>
  <g class="avatar-card" transform="translate(124, 24)">
    <a href="https://github.com/lsby" target="_blank" rel="noopener noreferrer">
      <title>lsby</title>
      <circle cx="40" cy="32" r="33.5" fill="none" stroke="#d0d7de" stroke-width="1.5" />
      <g transform="translate(8, 0)" clip-path="url(#clip-1)">
        <image href="data:image/jpeg;base64," width="64" height="64" />
      </g>
      <text class="username" x="40" y="82">lsby</text>
    </a>
  </g>
</svg>
